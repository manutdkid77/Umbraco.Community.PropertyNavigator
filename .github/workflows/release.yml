name: Release Package

# Runs when a version tag is pushed, e.g. `git tag 1.0.0 && git push origin 1.0.0`.
# Publishes via NuGet Trusted Publishing (OIDC): needs a Trusted Publishing policy on
# nuget.org for this repo + this workflow file, and a NUGET_USER repository secret
# holding the nuget.org profile name (not the email). No API key stored in GitHub.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  build:
    # Don't try to publish from forks
    if: github.repository == 'manutdkid77/Umbraco.Community.PropertyNavigator'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job request a GitHub OIDC token to trade for a short-lived NuGet API key
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build & Pack
        run: dotnet pack src/Umbraco.Community.PropertyNavigator/Umbraco.Community.PropertyNavigator.csproj -c Release -o artifacts /p:Version=${{ github.ref_name }}

      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Also pushes the matching .snupkg symbols package from the same folder
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
